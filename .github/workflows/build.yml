name: Build AR Drawing APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Loaded debug.keystore from GitHub Secret."
          elif [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Loaded debug.keystore from debug.keystore.base64."
          fi
          if [ ! -f debug.keystore ]; then
            echo "::warning::debug.keystore.base64 not found and DEBUG_KEYSTORE_BASE64 secret is not set. Generating a new keystore (Google Sign-In requires SHA-1 registered in Firebase)."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Loaded google-services.json from GitHub Secret."
          elif [ ! -f app/google-services.json ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret is not set. Writing CI placeholder so Gradle build succeeds. Add GOOGLE_SERVICES_JSON in GitHub Secrets for live Firebase Sign-In & Admin Panel."
            cat <<'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder-project",
              "storage_bucket": "ci-placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.advancedrawing.studio"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "ci-placeholder-web-client-id",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "ci-placeholder-api-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ARDrawing-apk
          path: app/build/outputs/apk/debug/app-debug.apk
